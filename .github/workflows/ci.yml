name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: dist/ is in sync with src/ (no drift)
        run: python3 generate.py --check

      - name: install.sh parses under bash
        run: bash -n install.sh
